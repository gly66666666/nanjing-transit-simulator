<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="试玩七个城市的地铁模拟器和长三角六城联动版，规划线路并运行客流仿真。">
  <title>地铁线网实验室</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: "Microsoft YaHei", "PingFang SC", system-ui, sans-serif;
      background: #080f1c;
      color: #edf4ff;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background: radial-gradient(ellipse at 20% 0%, #173253, transparent 52rem);
    }
    main { width: min(100%, 960px); margin: 0 auto; padding: clamp(36px, 8vw, 88px) 24px 44px; }
    h1, h2, p { margin: 0; }
    h1 { font-size: clamp(2.25rem, 7vw, 4rem); letter-spacing: -.04em; line-height: 1.12; }
    h2 { font-size: 1.25rem; }
    .intro, .region p, .save-note { color: #adc0d8; line-height: 1.65; }
    .intro { margin-top: 14px; }
    .region, .city-list a {
      color: inherit;
      text-decoration: none;
      border: 1px solid #2d4563;
      border-radius: 12px;
    }
    .region {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      margin: 32px 0;
      padding: 24px;
      border-left: 4px solid #50d9c4;
      background: #112b39;
    }
    .region h2 { font-size: 1.45rem; }
    .region p { margin-top: 6px; }
    .region .action { color: #76ecda; font-weight: 700; white-space: nowrap; }
    .region:hover { border-color: #76ecda; background: #163647; }
    .city-list {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(min(100%, 170px), 1fr));
      gap: 12px;
      margin: 14px 0 0;
      padding: 0;
      list-style: none;
    }
    .city-list a {
      display: flex;
      align-items: center;
      justify-content: space-between;
      min-height: 64px;
      padding: 14px 18px;
      background: #122035;
      font-weight: 650;
    }
    .city-list a span { color: #86bdff; }
    .city-list a:hover { border-color: #86bdff; background: #1a3050; }
    a:focus-visible { outline: 2px solid #86bdff; outline-offset: 4px; }
    .save-note { margin-top: 26px; font-size: .875rem; }
  </style>
</head>
<body>
  <main>
    <h1>地铁线网实验室</h1>
    <p class="intro">选择城市，规划地铁线路、调整运力并模拟早高峰。</p>

    <a class="region" href="./长三角六城地铁模拟器.html">
      <div>
        <h2>长三角六城联动</h2>
        <p>在同一张地图上查看南京、常州、无锡、苏州、上海和南通。</p>
      </div>
      <span class="action">进入六城版 <span aria-hidden="true">→</span></span>
    </a>

    <nav aria-labelledby="city-heading">
      <h2 id="city-heading">单城模拟</h2>
      <ul class="city-list">
        <li><a href="./南京地铁模拟器.html">南京 <span aria-hidden="true">→</span></a></li>
        <li><a href="./常州地铁模拟器.html">常州 <span aria-hidden="true">→</span></a></li>
        <li><a href="./无锡地铁模拟器.html">无锡 <span aria-hidden="true">→</span></a></li>
        <li><a href="./苏州地铁模拟器.html">苏州 <span aria-hidden="true">→</span></a></li>
        <li><a href="./上海地铁模拟器.html">上海 <span aria-hidden="true">→</span></a></li>
        <li><a href="./南通地铁模拟器.html">南通 <span aria-hidden="true">→</span></a></li>
        <li><a href="./徐州地铁模拟器.html">徐州 <span aria-hidden="true">→</span></a></li>
      </ul>
    </nav>

    <p class="save-note">建议用电脑浏览器。每个版本独立自动保存规划，下次用同一个浏览器打开即可继续。</p>
  </main>
</body>
</html>
