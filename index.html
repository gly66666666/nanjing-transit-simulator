<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="在浏览器里规划南京地铁和公交线路，调整运力，运行客流仿真。">
  <title>南京交通模拟器</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: "Microsoft YaHei", "PingFang SC", system-ui, sans-serif;
      background: #080e19;
      color: #eef4ff;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 48px 24px;
      background: radial-gradient(ellipse at 38% 0%, #142848, transparent 62%);
    }
    main { width: min(100%, 840px); }
    h1 { margin: 0; font-size: clamp(2.25rem, 7vw, 4.25rem); letter-spacing: -.04em; }
    .intro, .note, .game p { color: #afc0d8; line-height: 1.65; }
    .intro { margin: 12px 0 32px; }
    .games { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
    .game {
      --accent: #70b6ff;
      display: flex;
      flex-direction: column;
      min-height: 208px;
      padding: 24px;
      border: 1px solid #2b3d58;
      border-top: 3px solid var(--accent);
      border-radius: 12px;
      background: #111c2c;
      color: inherit;
      text-decoration: none;
    }
    .game.bus { --accent: #5de0b5; }
    .game:hover { background: #17263b; border-color: var(--accent); }
    .game:focus-visible { outline: 2px solid var(--accent); outline-offset: 4px; }
    .game h2 { margin: 0; font-size: 1.45rem; }
    .game p { margin: 10px 0 24px; }
    .game span { margin-top: auto; color: var(--accent); font-weight: 650; }
    .note { margin: 20px 0 0; font-size: .875rem; }
    @media (max-width: 560px) {
      .games { grid-template-columns: 1fr; }
      .game { min-height: 172px; }
    }
  </style>
</head>
<body>
  <main>
    <h1>南京交通模拟器</h1>
    <p class="intro">规划线路、调整运力，看看你的方案如何应对早高峰。</p>
    <nav class="games" aria-label="选择模拟器">
      <a class="game" href="./南京地铁模拟器.html">
        <h2>南京地铁</h2>
        <p>查看地铁线网，规划线路和站点，观察列车运行、排队和换乘。</p>
        <span>进入地铁模拟器 <span aria-hidden="true">→</span></span>
      </a>
      <a class="game bus" href="./南京公交模拟器.html">
        <h2>南京公交</h2>
        <p>调整公交线路、班次和车辆配置，查看仿真成绩单。</p>
        <span>进入公交模拟器 <span aria-hidden="true">→</span></span>
      </a>
    </nav>
    <p class="note">模拟器建议用电脑浏览器打开，便于查看地图和操作面板。</p>
  </main>
</body>
</html>
