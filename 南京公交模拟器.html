<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>南京公交模拟器 · 线网重规划与仿真</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0d1117; --panel:#161b22; --panel2:#1c2128; --line:#30363d;
  --fg:#e6edf3; --dim:#8b949e; --blue:#58a6ff; --green:#3fb950;
  --amber:#d29922; --red:#f85149; --purple:#bc8cff;
}
html,body{height:100%;overflow:hidden}
body{background:var(--bg);color:var(--fg);font:13px/1.5 -apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}
#app{display:grid;grid-template-columns:264px 1fr 300px;grid-template-rows:1fr 56px;height:100vh}
#left,#right{background:var(--panel);overflow-y:auto;border-right:1px solid var(--line)}
#right{border-right:none;border-left:1px solid var(--line)}
#center{position:relative;overflow:hidden;background:#0a0e14}
canvas{display:block;width:100%;height:100%}
#bar{grid-column:1/-1;background:var(--panel2);border-top:1px solid var(--line);display:flex;align-items:center;gap:12px;padding:0 14px}
h2{font-size:13px;font-weight:600;padding:12px 14px 8px;color:var(--fg);letter-spacing:.5px;display:flex;justify-content:space-between;align-items:center}
h2 span{font-weight:400;color:var(--dim);font-size:11px}
#search{margin:0 12px 8px;width:calc(100% - 24px);background:#0d1117;border:1px solid var(--line);color:var(--fg);padding:6px 9px;border-radius:6px;font-size:12px;outline:none}
#search:focus{border-color:var(--blue)}
#filters{display:flex;gap:5px;padding:0 12px 10px;flex-wrap:wrap}
.chip{font-size:11px;padding:3px 9px;border-radius:11px;background:#21262d;border:1px solid transparent;color:var(--dim);cursor:pointer;user-select:none}
.chip.on{background:rgba(88,166,255,.16);border-color:rgba(88,166,255,.5);color:var(--blue)}
#list{display:flex;flex-direction:column}
.item{padding:7px 12px 7px 14px;border-bottom:1px solid #21262d;cursor:pointer;position:relative;border-left:3px solid transparent}
.item:hover{background:#1c2128}
.item.on{background:rgba(88,166,255,.1);border-left-color:var(--blue)}
.item .code{font-weight:600;font-size:12.5px;color:var(--fg)}
.item .path{font-size:11px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
.item .meta{font-size:10px;color:#6e7681;margin-top:2px}
.item.custom .code::after{content:"已改";font-size:9px;color:var(--amber);border:1px solid rgba(210,153,34,.4);border-radius:3px;padding:0 3px;margin-left:5px;vertical-align:1px}
#detail{padding:0 14px 14px}
#detail .big{font-size:19px;font-weight:700;margin:4px 0 2px}
#detail .sub{font-size:11px;color:var(--dim)}
.kv{display:grid;grid-template-columns:1fr auto;gap:4px 8px;margin-top:10px;font-size:12px}
.kv .k{color:var(--dim)}
.kv .v{text-align:right;font-variant-numeric:tabular-nums}
.block{margin-top:14px;padding-top:12px;border-top:1px solid var(--line)}
.block h3{font-size:12px;color:var(--dim);font-weight:500;margin-bottom:8px;display:flex;justify-content:space-between}
input[type=range]{width:100%;accent-color:var(--blue)}
.btn{background:#21262d;border:1px solid var(--line);color:var(--fg);padding:6px 11px;border-radius:6px;cursor:pointer;font-size:12px}
.btn:hover{background:#30363d}
.btn.primary{background:#238636;border-color:#2ea043;color:#fff}
.btn.primary:hover{background:#2ea043}
.btn.ghost{background:transparent}
.btn.sm{padding:3px 8px;font-size:11px}
.btn:disabled{opacity:.4;cursor:not-allowed}
.row{display:flex;gap:6px;align-items:center}
#hud{position:absolute;left:12px;top:12px;background:rgba(13,17,23,.86);border:1px solid var(--line);border-radius:8px;padding:8px 11px;font-size:11px;color:var(--dim);backdrop-filter:blur(6px);pointer-events:none}
#hud b{color:var(--fg);font-variant-numeric:tabular-nums}
#tip{position:absolute;right:12px;bottom:12px;background:rgba(13,17,23,.86);border:1px solid var(--line);border-radius:8px;padding:7px 10px;font-size:11px;color:var(--dim);pointer-events:none;max-width:420px}
#stats{display:flex;gap:18px;flex:1;font-size:11.5px;color:var(--dim);flex-wrap:wrap}
#stats b{color:var(--fg);font-variant-numeric:tabular-nums;font-size:14px;font-weight:600;margin-left:3px}
#stats .u{font-size:10px;color:#6e7681;margin-left:1px}
#replay{width:130px;accent-color:var(--green)}
#result{position:fixed;inset:0;background:rgba(3,6,10,.75);display:none;align-items:center;justify-content:center;backdrop-filter:blur(3px);z-index:20}
#result.on{display:flex}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;width:min(560px,92vw);max-height:86vh;overflow-y:auto;padding:20px 22px;box-shadow:0 16px 48px rgba(0,0,0,.5)}
.card h1{font-size:15px;margin-bottom:4px}
.grade{display:flex;align-items:baseline;gap:10px;margin:14px 0 4px}
.grade .g{font-size:44px;font-weight:800;letter-spacing:-1px}
.grade .s{font-size:22px;font-weight:700}
.mrow{display:grid;grid-template-columns:78px 1fr 66px;gap:8px;align-items:center;font-size:11.5px;margin:7px 0;color:var(--dim)}
.mbar{height:6px;background:#21262d;border-radius:3px;overflow:hidden}
.mbar>i{display:block;height:100%;border-radius:3px;background:var(--blue);transition:width .5s}
.mrow .mv{text-align:right;color:var(--fg);font-variant-numeric:tabular-nums}
.sep{height:1px;background:var(--line);margin:14px 0}
.tag{display:inline-block;font-size:10.5px;padding:2px 7px;border-radius:9px;margin:2px 4px 2px 0}
.tag.g{background:rgba(63,185,80,.15);color:var(--green)}
.tag.r{background:rgba(248,81,73,.15);color:var(--red)}
.tag.a{background:rgba(210,153,34,.15);color:var(--amber)}
.tag.b{background:rgba(88,166,255,.15);color:var(--blue)}
#list .vbtn{position:absolute;right:8px;top:50%;transform:translateY(-50%);font-size:10px;color:var(--dim);border:1px solid var(--line);border-radius:4px;padding:1px 5px;opacity:0;transition:opacity .15s}
.item:hover .vbtn{opacity:1}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-thumb{background:#30363d;border-radius:5px}
::-webkit-scrollbar-thumb:hover{background:#3d444c}
</style>
</head>
<body>
<div id="app">
  <aside id="left">
    <h2>线路 <span id="cnt"></span></h2>
    <input id="search" placeholder="线路号 / 站名…">
    <div id="filters">
      <span class="chip on" data-f="all">全部</span>
      <span class="chip" data-f="city">主城</span>
      <span class="chip" data-f="sub">郊区</span>
      <span class="chip" data-f="night">夜间</span>
      <span class="chip" data-f="custom">已改</span>
    </div>
    <div id="list"></div>
  </aside>

  <main id="center">
    <canvas id="cv"></canvas>
    <div id="hud"></div>
    <div id="tip">滚轮缩放 · 拖动平移 · 点线路查看详情</div>
  </main>

  <aside id="right">
    <h2>线路详情 <span id="detcode"></span></h2>
    <div class="row" style="padding:0 12px 10px">
      <button class="btn sm" id="newline">＋ 新建线路</button>
      <button class="btn sm primary" id="editdone" style="display:none">完成画线</button>
      <span id="budget" style="margin-left:auto;font-size:11px;color:var(--dim)"></span>
    </div>
    <div id="detail"><div class="sub" style="padding:0 14px">选择左侧线路，或在地图上点击一条线。</div></div>
  </aside>

  <div id="bar">
    <button class="btn primary" id="run">▶ 开始仿真</button>
    <input type="range" id="replay" min="0" max="100" value="0">
    <div id="stats"></div>
    <button class="btn" id="reset">重置全部改动</button>
  </div>
</div>

<div id="result"><div class="card" id="resultCard"></div></div>

/* ================= 引擎 ================= */
const K = {
  SIM_MIN: 120,      // 早高峰 7:00-9:00
  CAP: 78,           // 单车额定容量（人，含站立）
  SPEED: 18,         // 运营速度 km/h
  DWELL: 0.35,       // 单站停站分钟
  WALK: 6,           // 步行接驳
  TRANSFER_PEN: 9,   // 一次换乘代价
  FARE: 1.2,         // 实际客收元/乘次（2 元票价，扣免费换乘/优惠卡后）
  COST_KM: 5.0,      // 元 / 车公里（含人工）
  BASE_GEN: 2900,    // 人/分钟（日均 113 万乘次，早高峰 2h 约 30%）
  TRANSFER_SHARE: 0.21
};

function initModel() {
  // 计算每线周转与配车
  for (const l of B.lines) {
    const n = l.stops.length;
    l.turn = (2 * l.len / K.SPEED) * 60 + n * K.DWELL;   // 往返分钟
    if (!l.headway) l.headway = l.len < 9 ? 7 : (l.len < 18 ? 9 : (l.len < 30 ? 13 : 20));
    l.fleet = Math.max(2, Math.ceil(l.turn / l.headway));
    l.custom = false;
  }
  // 站点 -> 线路
  B.byStop = B.stops.map(() => []);
  B.lines.forEach((l, li) => {
    for (const s of l.stops) if (B.byStop[s].indexOf(li) < 0) B.byStop[s].push(li);
  });
}

/* 单线客流分配：站序 + 距离衰减 */
function lineLoad(l, rate, scale) {
  const st = l.stops, n = st.length;
  const g = new Array(n), al = new Array(n).fill(0);
  for (let k = 0; k < n; k++) {
    const sid = st[k];
    g[k] = rate[sid] * K.SIM_MIN / Math.max(1, B.byStop[sid].length);
  }
  // 同线目的地按 1/段距 衰减
  for (let i = 0; i < n - 1; i++) {
    let ws = 0;
    for (let j = i + 1; j < n; j++) ws += 1 / (j - i);
    if (!ws) continue;
    for (let j = i + 1; j < n; j++) al[j] += g[i] * (1 / (j - i)) / ws;
  }
  let cur = 0, mx = 0, segW = 0, rideSum = 0, genSum = 0, rideN = 0;
  for (let k = 0; k < n; k++) {
    cur += g[k];
    cur -= al[k];
    if (cur < 0) cur = 0;
    if (k < n - 1) { if (cur > mx) mx = cur; segW += cur; }
    genSum += g[k];
  }
  // 平均乘坐段数
  for (let i = 0; i < n - 1; i++) {
    let ws = 0;
    for (let j = i + 1; j < n; j++) ws += 1 / (j - i);
    for (let j = i + 1; j < n; j++) rideSum += g[i] * (1 / (j - i)) / ws * (j - i);
  }
  rideN = genSum || 1;
  l._gen = genSum;
  l._board = genSum;
  l._maxLoad = mx;
  l._avgRideStops = rideSum / rideN;
  l._trips = K.SIM_MIN / l.headway * 2;
  l._capDir = K.CAP * (K.SIM_MIN / l.headway);     // 单方向运力
  l._sat = l._capDir > 0 ? mx / l._capDir : 0;
  l._segTime = n > 1 ? (l.len / (n - 1)) / K.SPEED * 60 + K.DWELL : 0;
  l._inVeh = l._avgRideStops * l._segTime;
  l._wait = l.headway / 2 * Math.min(2.4, Math.max(1, l._sat));
  l._abandon = l._sat > 2.2 ? (l._sat - 2.2) / l._sat : 0;
  l._vehKm = l._trips * 0.5 * 2 * l.len;            // 单方向 trips/2 次
  l._cost = l._vehKm * K.COST_KM;
  l._rev = genSum * K.FARE;
}

/* 全量分析 */
function analyze(scale) {
  scale = scale || 1;
  const st = B.stops;
  let wsum = 0;
  const w = new Array(st.length);
  for (let i = 0; i < st.length; i++) {
    const c = st[i][3] || 1;
    w[i] = 0.2 + 0.8 * Math.min(c, 9) / 9;
    wsum += w[i];
  }
  const per = K.BASE_GEN * scale / (wsum || 1);
  const rate = w.map(x => x * per);

  let gen = 0, board = 0, cost = 0, rev = 0, vehKm = 0;
  let waitW = 0, inW = 0, abandW = 0, satMax = 0, loadMax = 0;
  let row = [];
  for (const l of B.lines) {
    if (l.hidden) { l._gen = 0; l._board = 0; l._sat = 0; l._wait = 0; l._maxLoad = 0; l._inVeh = 0; l._abandon = 0; l._cost = 0; l._rev = 0; continue; }
    lineLoad(l, rate, scale);
    gen += l._gen; board += l._gen;
    cost += l._cost; rev += l._rev; vehKm += l._vehKm;
    waitW += l._gen * l._wait; inW += l._gen * l._inVeh; abandW += l._gen * l._abandon;
    if (l._sat > satMax) satMax = l._sat;
    if (l._maxLoad > loadMax) loadMax = l._maxLoad;
    row.push(l);
  }
  const g = gen || 1;
  const avgWait = waitW / g, avgIn = inW / g, aband = abandW / g;
  // 满载峰值取 95 分位，避免个别极端线主导评分
  const sats = B.lines.filter(l => !l.hidden && l._sat > 0).map(l => l._sat).sort((a, b) => a - b);
  const satP = sats.length ? sats[Math.min(sats.length - 1, Math.floor(sats.length * 0.95))] : 0;
  const satMax2 = satP;
  const transfer = K.TRANSFER_SHARE;
  const boardAll = gen * (1 + transfer);            // 含换乘
  const door = K.WALK + avgWait + avgIn + (avgIn > 0 ? transfer * K.TRANSFER_PEN : 0);
  const revAll = gen * K.FARE;
  const ratio = cost / (revAll || 1);

  // 评分（初始约 78-82，优化可上 90+）
  let score = 100;
  score -= Math.max(0, avgWait - 5.6) * 7;
  score -= Math.max(0, satMax - 0.78) * 78;
  score -= aband * 500;
  score -= Math.max(0, 0.50 - 1 / ratio) * 105;
  score -= Math.max(0, door - 40) * 1.2;
  score = Math.max(0, Math.min(100, score));
  const grade = score >= 88 ? 'A' : score >= 75 ? 'B' : score >= 62 ? 'C' : 'D';

  const lines = B.lines.filter(l => !l.hidden);
  const hot = lines.slice().sort((a, b) => b._maxLoad - a._maxLoad).slice(0, 5)
    .map(l => ({ code: l.code, sat: l._sat }));
  const worstWait = lines.slice().sort((a, b) => b._wait - a._wait).slice(0, 5)
    .map(l => ({ code: l.code, w: l._wait }));

  return {
    scale, gen, board: boardAll, ratio: boardAll / g, avgWait, avgIn, door,
    satMax: satMax2, loadMax, aband, cost, rev: revAll, vehKm, ratioCost: ratio,
    score, grade, hot, worstWait, nLines: lines.length
  };
}

/* OD 查询：从 A 站到 B 站的最优线路组合（含 1 次换乘） */
function odSearch(fromName, toName) {
  const idx = n => B.stops.findIndex(s => s[0] === n);
  const a = idx(fromName), b = idx(toName);
  if (a < 0 || b < 0) return null;
  let best = null;
  const la = B.byStop[a] || [], lb = B.byStop[b] || [];
  // 直达
  for (const li of la) {
    const l = B.lines[li];
    if (l.hidden) continue;
    const p1 = l.stops.indexOf(a), p2 = l.stops.indexOf(b);
    if (p1 >= 0 && p2 > p1) {
      const stops = p2 - p1;
      const t = K.WALK + l._wait + stops * l._segTime;
      if (!best || t < best.t) best = { t, path: [l.code], line: l, stops };
    }
  }
  // 一次换乘
  for (const li of la) {
    const l1 = B.lines[li]; if (l1.hidden) continue;
    const p1 = l1.stops.indexOf(a);
    if (p1 < 0) continue;
    for (let k = p1 + 1; k < l1.stops.length; k++) {
      const mid = l1.stops[k];
      const l2s = B.byStop[mid] || [];
      for (const lj of l2s) {
        if (lj === li) continue;
        const l2 = B.lines[lj]; if (l2.hidden) continue;
        const q1 = l2.stops.indexOf(mid), q2 = l2.stops.indexOf(b);
        if (q1 >= 0 && q2 > q1) {
          const t = K.WALK + l1._wait + (k - p1) * l1._segTime + K.TRANSFER_PEN
            + l2._wait + (q2 - q1) * l2._segTime;
          if (!best || t < best.t) best = { t, path: [l1.code, l2.code], stops: (k - p1) + (q2 - q1) };
        }
      }
    }
  }
  return best;
}

/* 挑战 */
function challenges(res, res150) {
  const list = [];
  list.push({ id: 'c1', name: '早高峰平均候车 ≤ 6 分钟', pass: res.avgWait <= 6, val: res.avgWait.toFixed(1) + ' 分' });
  list.push({ id: 'c2', name: '满载率 95 分位 ≤ 78%', pass: res.satMax <= 0.78, val: (res.satMax * 100).toFixed(0) + '%' });
  list.push({ id: 'c3', name: '客流 150% 时放弃率 < 3%', pass: res150.aband < 0.03, val: (res150.aband * 100).toFixed(1) + '%' });
  list.push({ id: 'c4', name: '票款覆盖率 ≥ 56%（补贴可控）', pass: res.ratioCost <= 1 / 0.56 + 0.01, val: (100 / res.ratioCost).toFixed(0) + '%' });
  return list;
}

/* ================= 渲染 ================= */
const cv = document.getElementById('cv');
const ctx = cv.getContext('2d');
const view = { x: 26, y: 18, s: 9 };
let DPR = Math.min(2, window.devicePixelRatio || 1);
let W = 0, H = 0;

function resize() {
  const r = cv.parentElement.getBoundingClientRect();
  W = r.width; H = r.height;
  DPR = Math.min(2, window.devicePixelRatio || 1);
  cv.width = W * DPR; cv.height = H * DPR;
  cv.style.width = W + 'px'; cv.style.height = H + 'px';
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  draw();
}
new ResizeObserver(resize).observe(cv.parentElement);

const sx = x => (x - view.x) * view.s;
const sy = y => (y - view.y) * view.s;
const wx = px => px / view.s + view.x;
const wy = py => py / view.s + view.y;

const PALETTE = ['#4a9fd8', '#e05252', '#3fa96b', '#8a6fd0', '#d8a83f', '#c85f8f',
  '#e08040', '#3fb3a6', '#7f96b8', '#9da84a', '#5ab0d0', '#b06a9a'];

function lineColor(l) {
  const c = l.code;
  if (/夜/.test(c)) return '#6a7b95';
  if (/观光/.test(c)) return '#c9a227';
  if (/机场|禄口/.test(c)) return '#7a8fa6';
  if (/^D/i.test(c)) return '#9a7b62';
  if (/^G/i.test(c)) return '#8c9a4e';
  if (/^K/i.test(c)) return '#a06a70';
  return PALETTE[l.id % PALETTE.length];
}

let hoverLine = -1, selLine = -1, hoverStop = -1;

function draw() {
  ctx.clearRect(0, 0, W, H);
  // 底图纹理
  ctx.fillStyle = '#0a0e14';
  ctx.fillRect(0, 0, W, H);

  const lw = Math.max(0.6, Math.min(2.2, view.s * 0.11));
  // 全部线路：可信段实绘，估算段淡化
  for (const l of B.lines) {
    if (l.hidden) continue;
    const isSel = l.id === selLine, isHov = l.id === hoverLine;
    // 视口粗筛
    let vis = false;
    for (const si of l.stops) {
      const s = B.stops[si], px = sx(s[1]), py = sy(s[2]);
      if (px > -30 && px < W + 30 && py > -30 && py < H + 30) { vis = true; break; }
    }
    if (!vis) continue;
    ctx.strokeStyle = lineColor(l);
    for (const pass of [2, 1, 0]) {
      ctx.beginPath();
      let any = false;
      for (let i = 1; i < l.stops.length; i++) {
        const a = B.stops[l.stops[i - 1]], b = B.stops[l.stops[i]];
        const lvl = (a[4] >= 1 && b[4] >= 1) ? 2 : ((a[4] === 2 || b[4] === 2) ? 1 : 0);
        if (lvl !== pass) continue;
        // 过滤跨区跳跃段（保持地图可读）
        if (!isSel && Math.hypot(a[1] - b[1], a[2] - b[2]) > 7.5) continue;
        ctx.moveTo(sx(a[1]), sy(a[2]));
        ctx.lineTo(sx(b[1]), sy(b[2]));
        any = true;
      }
      if (!any) continue;
      ctx.globalAlpha = pass === 2 ? (isSel ? 1 : (isHov ? 0.95 : (l.custom ? 0.82 : 0.5)))
        : pass === 1 ? (isSel ? 0.55 : 0.3) : (isSel ? 0.3 : 0.09);
      ctx.lineWidth = pass === 2
        ? (isSel ? lw * 2.6 : (isHov ? lw * 1.9 : lw))
        : pass === 1 ? Math.max(0.55, lw * 0.85) : Math.max(0.45, lw * 0.6);
      ctx.stroke();
    }
  }
  ctx.globalAlpha = 1;

  // 站点
  if (view.s > 5) {
    for (let i = 0; i < B.stops.length; i++) {
      const s = B.stops[i], c = s[3] || 1;
      const px = sx(s[1]), py = sy(s[2]);
      if (px < -6 || px > W + 6 || py < -6 || py > H + 6) continue;
      if (c < 3 && view.s < 11) continue;
      if (view.s < 7.5 && c < 7) continue;
      const r = Math.max(1, Math.min(3.4, 0.55 + c * 0.28));
      ctx.beginPath();
      ctx.arc(px, py, r, 0, 6.284);
      ctx.fillStyle = (i === hoverStop) ? '#fff' : (c >= 6 ? 'rgba(230,237,243,.78)' : 'rgba(150,160,175,.5)');
      ctx.fill();
    }
  }

  // 选中线：站序点 + 名称
  if (selLine >= 0 && view.s > 4) {
    const l = B.lines[selLine];
    ctx.font = '11px -apple-system,"PingFang SC",sans-serif';
    ctx.textBaseline = 'middle';
    for (let i = 0; i < l.stops.length; i++) {
      const s = B.stops[l.stops[i]], px = sx(s[1]), py = sy(s[2]);
      if (px < -40 || px > W + 40 || py < -20 || py > H + 20) continue;
      ctx.beginPath();
      ctx.arc(px, py, 3, 0, 6.284);
      ctx.fillStyle = '#fff';
      ctx.fill();
      ctx.strokeStyle = lineColor(l);
      ctx.lineWidth = 1.5;
      ctx.stroke();
      if (view.s > 9 || i === 0 || i === l.stops.length - 1) {
        ctx.fillStyle = 'rgba(230,237,243,.9)';
        ctx.fillText(s[0], px + 7, py - 7);
      }
    }
  }

  // 仿真车辆
  if (Sim.running || Sim.t > 0) drawVehicles();
}

function drawVehicles() {
  const t = Sim.t;
  ctx.save();
  for (const l of B.lines) {
    if (l.hidden || !l.fleet) continue;
    const n = l.stops.length;
    if (n < 2) continue;
    const totalStops = n - 1;
    const cycle = 2 * (l.len / K.SPEED * 60 + n * K.DWELL) / Math.max(1, l.headway);
    const head = t / Math.max(1, l.headway);
    for (let v = 0; v < Math.min(8, l.fleet); v++) {
      let ph = ((head + v) % Math.max(1, l.fleet)) / Math.max(1, l.fleet);
      const pos = ph * totalStops * 2;
      const dir = pos < totalStops ? 1 : -1;
      const k = pos < totalStops ? pos : (2 * totalStops - pos);
      const i0 = Math.floor(k), frac = k - i0;
      if (i0 >= n - 1) continue;
      const a = B.stops[l.stops[dir > 0 ? i0 : n - 1 - i0]];
      const b = B.stops[l.stops[dir > 0 ? i0 + 1 : n - 2 - i0]];
      const px = sx(a[1] + (b[1] - a[1]) * frac), py = sy(a[2] + (b[2] - a[2]) * frac);
      if (px < 0 || px > W || py < 0 || py > H) continue;
      ctx.beginPath();
      ctx.arc(px, py, 2.4, 0, 6.284);
      ctx.fillStyle = l.id === selLine ? '#fff' : lineColor(l);
      ctx.globalAlpha = 0.9;
      ctx.fill();
    }
  }
  ctx.restore();
}

/* ---------- 交互 ---------- */
let drag = null;
cv.addEventListener('mousedown', e => { drag = { x: e.clientX, y: e.clientY, vx: view.x, vy: view.y, moved: false }; });
window.addEventListener('mousemove', e => {
  if (drag) {
    const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
    if (Math.abs(dx) + Math.abs(dy) > 3) drag.moved = true;
    view.x = drag.vx - dx / view.s;
    view.y = drag.vy - dy / view.s;
    draw();
  }
});
window.addEventListener('mouseup', e => {
  if (drag && !drag.moved) hitTest(e);
  drag = null;
});
cv.addEventListener('wheel', e => {
  e.preventDefault();
  const r = cv.getBoundingClientRect();
  const mx = e.clientX - r.left, my = e.clientY - r.top;
  const k = e.deltaY < 0 ? 1.16 : 0.86;
  const ns = Math.max(2.2, Math.min(34, view.s * k));
  const ax = wx(mx), ay = wy(my);
  view.s = ns;
  view.x = ax - mx / ns;
  view.y = ay - my / ns;
  draw();
}, { passive: false });

let lastMouse = null;
cv.addEventListener('mousemove', e => { lastMouse = e; });

function hitTest(e) {
  if (typeof EditMode !== 'undefined' && EditMode.on) { EditMode.pick(e); return; }
  const r = cv.getBoundingClientRect();
  const mx = e.clientX - r.left, my = e.clientY - r.top;
  // 先找站
  let bestStop = -1, bd = 9;
  for (let i = 0; i < B.stops.length; i++) {
    const s = B.stops[i];
    const d = Math.hypot(sx(s[1]) - mx, sy(s[2]) - my);
    if (d < bd) { bd = d; bestStop = i; }
  }
  // 再找线（点到线段距离）
  let bestLine = -1, bl = 11;
  for (const l of B.lines) {
    if (l.hidden) continue;
    for (let i = 1; i < l.stops.length; i++) {
      const a = B.stops[l.stops[i - 1]], b = B.stops[l.stops[i]];
      const d = segDist(mx, my, sx(a[1]), sy(a[2]), sx(b[1]), sy(b[2]));
      if (d < bl) { bl = d; bestLine = l.id; }
    }
  }
  if (bestLine >= 0) selectLine(bestLine);
  else if (bestStop >= 0) selectStop(bestStop);
}

function segDist(px, py, x1, y1, x2, y2) {
  const dx = x2 - x1, dy = y2 - y1;
  const t = Math.max(0, Math.min(1, ((px - x1) * dx + (py - y1) * dy) / (dx * dx + dy * dy || 1)));
  return Math.hypot(px - (x1 + dx * t), py - (y1 + dy * t));
}

function fitView(bounds) {
  const pad = 40;
  const bw = bounds ? (bounds[1] - bounds[0]) : 44, bh = bounds ? (bounds[3] - bounds[2]) : 40;
  const s = Math.min((W - pad) / Math.max(6, bw), (H - pad) / Math.max(6, bh));
  view.s = Math.max(2.4, Math.min(30, s));
  view.x = (bounds ? bounds[0] : 26) - (W / 2) / view.s + Math.max(6, bw) / 2;
  view.y = (bounds ? bounds[2] : 18) - (H / 2) / view.s + Math.max(6, bh) / 2;
  draw();
}

function fitCity() {
  const xs = [], ys = [];
  for (const l of B.lines) {
    if (l.hidden) continue;
    for (const si of l.stops) { const s = B.stops[si]; xs.push(s[1]); ys.push(s[2]); }
  }
  if (!xs.length) return;
  xs.sort((a, b) => a - b); ys.sort((a, b) => a - b);
  const q = (arr, p) => arr[Math.max(0, Math.min(arr.length - 1, Math.floor(arr.length * p)))];
  fitView([q(xs, 0.02), q(xs, 0.98), q(ys, 0.02), q(ys, 0.96)]);
}

function clearHover() { hoverLine = -1; hoverStop = -1; draw(); }

cv.addEventListener('mousemove', e => {
  if (drag) return;
  const r = cv.getBoundingClientRect();
  const mx = e.clientX - r.left, my = e.clientY - r.top;
  let bl = 12, bline = -1;
  for (const l of B.lines) {
    if (l.hidden) continue;
    for (let i = 1; i < l.stops.length; i++) {
      const a = B.stops[l.stops[i - 1]], b = B.stops[l.stops[i]];
      const d = segDist(mx, my, sx(a[1]), sy(a[2]), sx(b[1]), sy(b[2]));
      if (d < bl) { bl = d; bline = l.id; }
    }
  }
  if (bline !== hoverLine) { hoverLine = bline; draw(); }
  cv.style.cursor = bline >= 0 ? 'pointer' : 'grab';
});

/* ================= UI ================= */

function lineMatches(l) {
  const f = filterState.f;
  if (f === 'city' && (l.len >= 18 || /夜/.test(l.code))) return false;
  if (f === 'sub' && l.len < 18) return false;
  if (f === 'night' && !/夜/.test(l.code)) return false;
  if (f === 'custom' && !l.custom) return false;
  const q = filterState.q;
  if (q) {
    const hay = l.code + ' ' + l.from + ' ' + l.to + ' ' + l.stops.map(si => B.stops[si][0]).join(' ');
    if (!hay.toLowerCase().includes(q.toLowerCase())) return false;
  }
  return true;
}

    <span>换乘比<b>${r.ratio.toFixed(2)}</b></span>
    <span>平均候车<b>${r.avgWait.toFixed(1)}</b><span class="u">分</span></span>
    <span>满载峰值<b style="color:${r.satMax > 0.92 ? 'var(--red)' : 'var(--green)'}">${(r.satMax * 100).toFixed(0)}</b><span class="u">%</span></span>
    <span>放弃<b>${(r.aband * 100).toFixed(1)}</b><span class="u">%</span></span>
    <span>评分<b style="color:${r.score >= 88 ? 'var(--green)' : r.score >= 75 ? 'var(--blue)' : 'var(--amber)'}">${Math.round(r.score)}</b><span class="u">${r.grade}</span></span>`;
}

function runQuick() {
  const r = analyze(1);
  lastResult = r;
  updateStats(r);
  draw();
  return r;
}

/* ---------- 仿真播放 ---------- */
$('run').onclick = () => { if (!Sim.running) startSim(); };

function startSim() {
  const r0 = analyze(1);
  const r150 = analyze(1.5);
  Sim.running = true; Sim.t = 0; Sim.last = performance.now();
  $('run').textContent = '仿真中…';
  $('run').disabled = true;
  const dur = 7500;
  const tick = now => {
    const dt = now - Sim.last; Sim.last = now;
    Sim.t += dt * (Math.max(1, B.lines.length) * 0) + dt;
    const prog = Math.min(1, Sim.t / dur);
    $('replay').value = Math.round(prog * 100);
    draw();
    if (prog >= 1) { Sim.running = false; $('run').textContent = '▶ 重新仿真'; $('run').disabled = false; showReport(r0, r150); return; }
    Sim.raf = requestAnimationFrame(tick);
  };
  Sim.raf = requestAnimationFrame(tick);
}

$('replay').oninput = e => { Sim.t = +e.target.value / 100 * 7500; draw(); };

function showReport(r, r150) {
  const ch = challenges(r, r150);
  const pass = ch.filter(c => c.pass).length;
  const col = r.grade === 'A' ? 'var(--green)' : r.grade === 'B' ? 'var(--blue)' : r.grade === 'C' ? 'var(--amber)' : 'var(--red)';
  const bars = [
    ['平均候车', r.avgWait, 12, '分', r.avgWait <= 7],
    ['门到门', r.door, 80, '分', r.door <= 52],
    ['满载峰值', r.satMax * 100, 120, '%', r.satMax <= 0.92],
    ['放弃率', r.aband * 100, 8, '%', r.aband < 0.03],
  ];
  $('resultCard').innerHTML = `
    <h1>早高峰仿真成绩单</h1>
    <div class="sub" style="color:var(--dim);font-size:11.5px">7:00–9:00 · ${r.nLines} 条线路 · 需求 100%</div>
    <div class="grade"><span class="g" style="color:${col}">${r.grade}</span>
      <span class="s" style="color:${col}">${Math.round(r.score)} 分</span>
      <span class="sub" style="margin-left:auto">挑战 <b style="color:var(--fg)">${pass}/${ch.length}</b></span></div>
    <div style="margin-top:14px">
      ${bars.map(b => `<div class="mrow"><span>${b[0]}</span>
        <div class="mbar"><i style="width:${Math.min(100, b[1] / b[2] * 100)}%;background:${b[4] ? 'var(--green)' : 'var(--red)'}"></i></div>
        <span class="mv">${typeof b[1] === 'number' ? b[1].toFixed(1) : b[1]}${b[3]}</span></div>`).join('')}
    </div>
    <div class="sep"></div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:6px 18px;font-size:12px">
      <div class="k" style="color:var(--dim)">生成客流</div><div style="text-align:right">${(r.gen / 1e4).toFixed(1)} 万人次</div>
      <div class="k" style="color:var(--dim)">乘车人次</div><div style="text-align:right">${(r.board / 1e4).toFixed(1)} 万乘次</div>
      <div class="k" style="color:var(--dim)">换乘比</div><div style="text-align:right">${r.ratio.toFixed(2)}</div>
      <div class="k" style="color:var(--dim)">运营车公里</div><div style="text-align:right">${(r.vehKm / 1e4).toFixed(1)} 万 km</div>
      <div class="k" style="color:var(--dim)">运营成本</div><div style="text-align:right">${(r.cost / 1e4).toFixed(1)} 万元</div>
      <div class="k" style="color:var(--dim)">票款收入</div><div style="text-align:right">${(r.rev / 1e4).toFixed(1)} 万元</div>
      <div class="k" style="color:var(--dim)">票款覆盖率</div><div style="text-align:right">${(100 / r.ratioCost).toFixed(0)}%</div>
      <div class="k" style="color:var(--dim)">150% 放弃率</div><div style="text-align:right">${(r150.aband * 100).toFixed(1)}%</div>
    </div>
    <div class="sep"></div>
    <div class="sub" style="color:var(--dim);font-size:11.5px;margin-bottom:5px">最拥挤 5 条</div>
    <div>${r.hot.map(h => `<span class="tag ${h.sat > 1 ? 'r' : 'a'}">${h.code} ${(h.sat * 100).toFixed(0)}%</span>`).join('')}</div>
    <div class="sub" style="color:var(--dim);font-size:11.5px;margin:10px 0 5px">候车最长 5 条</div>
    <div>${r.worstWait.map(h => `<span class="tag b">${h.code} ${h.w.toFixed(1)}分</span>`).join('')}</div>
    <div class="sep"></div>
    <div style="font-size:11.5px;line-height:1.8;color:var(--dim)">
      ${ch.map(c => `<span class="tag ${c.pass ? 'g' : 'r'}">${c.pass ? '✓' : '✗'} ${c.name}（${c.val}）</span>`).join('<br>')}
    </div>
    <div class="row" style="margin-top:16px;justify-content:flex-end">
      <button class="btn" onclick="document.getElementById('result').classList.remove('on')">关闭</button>
      <button class="btn primary" onclick="document.getElementById('result').classList.remove('on');document.getElementById('run').click()">再跑一次</button>
    </div>`;
  $('result').classList.add('on');
}

/* ---------- 筛选 ---------- */
document.querySelectorAll('.chip').forEach(c => {
  c.onclick = () => {
    document.querySelectorAll('.chip').forEach(x => x.classList.remove('on'));
    c.classList.add('on');
    filterState.f = c.dataset.f;
    renderList();
  };
});
$('search').oninput = e => { filterState.q = e.target.value.trim(); renderList(); };
$('reset').onclick = () => {
  for (const l of B.lines) { l.hidden = false; l.headway = 0; l.custom = false; initOne(l); }
  selLine = -1;
  renderList();
  runQuick();
  fitCity();
  $('detcode').textContent = '';
  detailEl.innerHTML = '<div class="sub" style="padding:0 14px">选择左侧线路，或在地图上点击一条线。</div>';
};

/* ---------- 启动 ---------- */
initModel();
renderList();
runQuick();
requestAnimationFrame(() => { requestAnimationFrame(() => { resize(); fitCity(); }); });

/* ================= 规划 / 画线 / 预算 ================= */
const BUDGET0 = 5200;          // 万元，新增运营预算（月度折算到高峰班次口径）
let budgetUsed = 0;
const EditMode = { on: false, draft: [], hover: -1 };

function budgetNow() {
  // 新增成本 = 所有改动线路的增量车公里 × 单公里成本
  let delta = 0;
  for (const l of B.lines) {
    if (!l._vehKm) continue;
    const base = l._baseVehKm;
    if (base == null) continue;
    delta += (l._vehKm - base) * K.COST_KM;
  }
  budgetUsed = Math.max(0, delta) / 1e4;
  const el = document.getElementById('budget');
  if (el) el.textContent = `预算 ${BUDGET0 - Math.round(budgetUsed)} 万`;
  return budgetUsed;
}

// 记录基线车公里
function snapshotBase() {
  for (const l of B.lines) l._baseVehKm = l._vehKm || 0;
}

function addLineFromDraft() {
  const seq = EditMode.draft.slice();
  if (seq.length < 2) { toast('至少选 2 个站'); return; }
  // 去掉连续重复
  const st = seq.filter((v, i) => i === 0 || v !== seq[i - 1]);
  const l = {
    id: B.lines.length,
    code: '新线' + (B.lines.filter(x => /^新线/.test(x.code)).length + 1),
    from: B.stops[st[0]][0],
    to: B.stops[st[st.length - 1]][0],
    stops: st,
    len: 0,
    hidden: 0,
    grade: 'A',
    custom: true
  };
  let len = 0;
  for (let i = 1; i < st.length; i++) {
    const a = B.stops[st[i - 1]], b = B.stops[st[i]];
    len += Math.hypot(a[1] - b[1], a[2] - b[2]);
  }
  l.len = +len.toFixed(1);
  l.headway = 10;
  l.turn = (2 * l.len / K.SPEED) * 60 + st.length * K.DWELL;
  l.fleet = Math.max(2, Math.ceil(l.turn / l.headway));
  B.lines.push(l);
  for (const s of st) if (!B.byStop[s]) B.byStop[s] = [l.id];
  B.byStop.forEach((arr, s) => { if (arr.indexOf(l.id) < 0) return; });
  st.forEach(s => { if (B.byStop[s].indexOf(l.id) < 0) B.byStop[s].push(l.id); });
  EditMode.draft = [];
  draw();
  runQuick();
  renderList();
  selectLine(l.id);
  toast('已新建 ' + l.code + '：' + l.stops.length + ' 站 / ' + l.len + ' km');
}

function toast(msg) {
  const t = document.getElementById('tip');
  t.textContent = msg;
  t.style.color = '#e6edf3';
  clearTimeout(toast._t);
  toast._t = setTimeout(() => { t.textContent = '滚轮缩放 · 拖动平移 · 点线路查看详情'; t.style.color = ''; }, 2600);
}

function pickStopAt(e) {
  const r = cv.getBoundingClientRect();
  const mx = e.clientX - r.left, my = e.clientY - r.top;
  let best = -1, bd = 14;
  for (let i = 0; i < B.stops.length; i++) {
    const s = B.stops[i];
    const d = Math.hypot(sx(s[1]) - mx, sy(s[2]) - my);
    if (d < bd) { bd = d; best = i; }
  }
  return best;
}

// 画线模式下的点击
EditMode.pick = function (e) {
  const sid = pickStopAt(e);
  if (sid < 0) { toast('请点在站点附近'); return; }
  EditMode.draft.push(sid);
  drawDraft();
};

function drawDraft() {
  draw();
  if (!EditMode.on || !EditMode.draft.length) return;
  ctx.save();
  ctx.beginPath();
  EditMode.draft.forEach((sid, i) => {
    const s = B.stops[sid];
    const px = sx(s[1]), py = sy(s[2]);
    if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
  });
  ctx.strokeStyle = '#3fb950';
  ctx.lineWidth = 3;
  ctx.setLineDash([7, 5]);
  ctx.stroke();
  ctx.setLineDash([]);
  EditMode.draft.forEach((sid, i) => {
    const s = B.stops[sid];
    const px = sx(s[1]), py = sy(s[2]);
    ctx.beginPath();
    ctx.arc(px, py, 4.5, 0, 6.284);
    ctx.fillStyle = i === 0 ? '#3fb950' : '#fff';
    ctx.fill();
    ctx.strokeStyle = '#3fb950';
    ctx.lineWidth = 1.6;
    ctx.stroke();
  });
  ctx.restore();
}

document.getElementById('newline').onclick = () => {
  EditMode.on = !EditMode.on;
  EditMode.draft = [];
  document.getElementById('newline').textContent = EditMode.on ? '取消画线' : '＋ 新建线路';
  document.getElementById('editdone').style.display = EditMode.on ? '' : 'none';
  cv.style.cursor = EditMode.on ? 'crosshair' : 'grab';
  toast(EditMode.on ? '在地图上依次点击站点，选完后点“完成画线”' : '已退出画线');
  drawDraft();
};

document.getElementById('editdone').onclick = () => {
  if (!EditMode.draft.length) { toast('还没选站'); return; }
  addLineFromDraft();
  EditMode.on = false;
  EditMode.draft = [];
  document.getElementById('newline').textContent = '＋ 新建线路';
  document.getElementById('editdone').style.display = 'none';
  cv.style.cursor = 'grab';
  draw();
};

// 每次分析后刷新预算
const _origRunQuick = runQuick;
runQuick = function () {
  const r = _origRunQuick();
  budgetNow();
  return r;
};

snapshotBase();

</script>
